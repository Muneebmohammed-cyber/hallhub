name: Build Android APK

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build the APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Copy the APK to the download folder
        run: |
          mkdir -p download
          cp android/app/build/outputs/apk/debug/app-debug.apk download/FarshadKu.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FarshadKu-apk
          path: download/FarshadKu.apk
      - name: Publish the APK on the site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A download
          git commit -m "Build FarshadKu.apk (run ${{ github.run_number }})" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
